# Local development services. Not for production.
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        # keeps data
#   docker compose -f docker-compose.dev.yml down -v     # deletes data
name: paperscholar-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperscholar
      POSTGRES_PASSWORD: paperscholar
      POSTGRES_DB: paperscholar
    ports:
      # Host port 54330 avoids clashing with a system Postgres on 5432.
      - "127.0.0.1:54330:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperscholar -d paperscholar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
