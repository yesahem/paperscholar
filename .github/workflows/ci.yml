name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      API_ORIGIN: http://localhost:8797
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      S3_TEST_ENDPOINT: http://localhost:54331
      S3_TEST_ACCESS_KEY_ID: ci
      S3_TEST_SECRET_ACCESS_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: packages/runner/environments/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Signs sessions for the backend started below. Generated per run, never stored.
      - name: Generate an auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run check-types

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Set up the runner's Python environment
        run: bun run runner:setup

      # An S3-compatible server standing in for Cloudflare R2. It needs a command,
      # which service containers cannot take, so it is started here.
      - name: Start the S3-compatible test server
        run: >-
          docker run -d --name objectstore -p 54331:7070
          -e ROOT_ACCESS_KEY=ci -e ROOT_SECRET_KEY=ci-secret-key
          versity/versitygw:v1.11.0 posix /tmp

      - name: Test
        run: bun run test

      - name: Verify content
        run: bun run content:verify

      - name: Build
        run: bun run build

      # The API contract (docs/specs/05-api.md §11), run against a backend serving
      # the repository's content from local storage.
      - name: Publish the content library to local storage
        run: bun run content:sync

      - name: Start the backend
        working-directory: apps/backend
        run: |
          nohup bun src/main.ts > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:8797/api/health > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install the Postman CLI
        run: curl -fsSL https://dl-cli.pstmn.io/install/linux64.sh | sh

      - name: Run the API contract collection
        run: >-
          postman collection run "postman/collections/PaperScholar API"
          -e postman/environments/local.environment.yaml

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
