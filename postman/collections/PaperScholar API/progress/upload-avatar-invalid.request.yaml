$kind: http-request
name: Upload something that is not an image
order: 5100
method: POST
url: "{{baseUrl}}/api/v1/me/avatar"
headers:
  - key: Origin
    value: "{{webOrigin}}"
body:
  type: formdata
  content:
    - key: avatar
      type: text
      value: not a file
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('is a validation error', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error.code).to.eql('validation_error');
      });
