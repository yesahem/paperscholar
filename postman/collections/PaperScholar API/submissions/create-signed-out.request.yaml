$kind: http-request
name: Create a run signed out
order: 1000
method: POST
url: "{{baseUrl}}/api/v1/submissions"
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{webOrigin}}"
body:
  type: json
  content: |-
    { "paperId": "{{paperId}}", "problemId": "{{problemId}}", "code": "x = 1", "mode": "run" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('needs a session', () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().error.code).to.eql('unauthenticated');
      });
