$kind: http-request
name: Get a submission that is not yours
order: 7000
method: GET
url: "{{baseUrl}}/api/v1/submissions/01890a5d-ac96-774b-bcce-b302099a8057"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
