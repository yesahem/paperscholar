$kind: http-request
name: Me when signed out
order: 1000
method: GET
url: "{{baseUrl}}/api/v1/me"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('is unauthenticated', () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().error.code).to.eql('unauthenticated');
      });
