$kind: http-request
name: Saving tracks as a user
order: 7410
method: PUT
url: "{{baseUrl}}/api/v1/admin/tracks"
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{webOrigin}}"
body:
  type: json
  content: |-
    {"revision": 0, "tracks": []}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('are not discoverable by an ordinary user', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().error.code).to.eql('not_found');
      });
