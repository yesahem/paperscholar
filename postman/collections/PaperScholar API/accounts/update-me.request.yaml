$kind: http-request
name: Update me
order: 4000
method: PATCH
url: "{{baseUrl}}/api/v1/me"
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{webOrigin}}"
body:
  type: json
  content: |-
    { "bio": "  Implementing papers, one step at a time.  " }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('saves the trimmed bio and returns the account', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().bio).to.eql('Implementing papers, one step at a time.');
      });
