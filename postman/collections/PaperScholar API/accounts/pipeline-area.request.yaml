$kind: http-request
name: Pipeline endpoints as a user
order: 7100
method: POST
url: "{{baseUrl}}/api/v1/admin/ingestions/upload-url"
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{webOrigin}}"
body:
  type: json
  content: |-
    {"filename": "paper.pdf", "size": 1000}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('are not discoverable by an ordinary user', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().error.code).to.eql('not_found');
      });
