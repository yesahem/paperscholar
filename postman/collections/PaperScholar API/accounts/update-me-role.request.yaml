$kind: http-request
name: Update me with a role
order: 5000
method: PATCH
url: "{{baseUrl}}/api/v1/me"
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{webOrigin}}"
body:
  type: json
  content: |-
    { "role": "admin" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('refuses fields it does not accept', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error.code).to.eql('validation_error');
      });
