$kind: http-request
name: Delete me without the right confirmation
order: 8000
method: DELETE
url: "{{baseUrl}}/api/v1/me"
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{webOrigin}}"
body:
  type: json
  content: |-
    { "confirm": "not-my-username" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('refuses and keeps the account', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error.code).to.eql('validation_error');
      });
