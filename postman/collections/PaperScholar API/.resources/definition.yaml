$kind: collection
name: PaperScholar API
description: |-
  The contract of the PaperScholar API (docs/specs/05-api.md) as runnable checks.
  Run against a local backend or a preview deployment:

      postman collection run "postman/collections/PaperScholar API" -e postman/environments/local.environment.yaml

  Requests discover a paper and problem from the catalogue, so the collection
  works on any instance with at least one published paper.
variables:
  - key: paperId
    value: ""
    description: Set by "List papers" to the first published paper.
  - key: problemId
    value: ""
    description: Set by "Get paper" to that paper's first problem.
  - key: username
    value: ""
    description: Set by "Sign up" to a fresh, unique username.
  - key: email
    value: ""
    description: Set by "Sign up" to a fresh address at example.com.
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      pm.test('carries a request id', () => {
        pm.expect(pm.response.headers.get('X-Request-Id')).to.be.a('string').and.not.empty;
      });
      pm.test('sends nosniff', () => {
        pm.expect(pm.response.headers.get('X-Content-Type-Options')).to.eql('nosniff');
      });
      // Better Auth's own routes answer in its format, not the API's envelope.
      const isAuthRoute = pm.request.url.getPath().startsWith('/api/auth/');
      if (pm.response.code >= 400 && !isAuthRoute) {
        pm.test('uses the error envelope', () => {
          const { error } = pm.response.json();
          pm.expect(error.code).to.be.a('string');
          pm.expect(error.message).to.be.a('string');
          pm.expect(error.requestId).to.eql(pm.response.headers.get('X-Request-Id'));
          pm.expect(pm.response.headers.get('Cache-Control')).to.eql('private, no-store');
        });
      }
